name: Build and publish RunPod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize publishes from different branches to the shared latest tag.
concurrency:
  group: runpod-image-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${REPOSITORY_OWNER,,}/neuralsignal-runpod-base" >> "$GITHUB_OUTPUT"

      - name: Make room for CUDA dependencies
        # These unused SDKs are preinstalled on the disposable hosted runner.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Linux AMD64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runpod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runpod-amd64
          cache-to: type=gha,mode=max,scope=runpod-amd64,ignore-error=true

      - name: Show published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### RunPod image published'
            echo "- Latest: \`$IMAGE:latest\`"
            echo "- Commit tag: \`$IMAGE:sha-$GITHUB_SHA\`"
            echo "- Exact image: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
