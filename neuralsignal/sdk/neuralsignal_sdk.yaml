# NeuralSignal SDK configuration
home: ./sdk_home
logging_level: INFO
# Evaluation mode can be indirect or direct
evaluation_mode: indirect
application_name: default # Needs to be defined when initializing
sub_application_name: default # Needs to be defined when initializing

# Generation Configs
max_new_tokens: 128
truncation_length: 0
use_dynamic_batch_size: True
max_oom_count: 20
zone_size: 1024

# Dataset creation configs
# for including features for the delta in specific layer names
featurize_delta_layers: ["encoder.T5Block.T5LayerSelfAttention.SelfAttention.o"] 

# Evaluation mode config
indirect_config:
  indirect_model: "google/flan-t5-large"
    #indirect_model: "t5-small"
  zone_size: 1024
  indirect_batch_size: 1
  # no_quantization, int8 or int4
  quantization: "no_quantization"
  device: "cuda"
  use_dynamic_batch_size: True
  max_oom_count: 50 # SDK will disable itself after this

# indirect instrumentation config
indirect_instrumentation_config:
  instrument_encoder: True
  instrument_decoder: True
  instrument_attention: True
  instrument_FF: True
  instrument_embedding: True
  collector_config:
    mode: additive
    data_to_save: ["inputs", "outputs", "layer_info", "topology"]
    zone_size: 1024

# Backend config
save_scans: True
save_vectors: False
backend_config:
  backend_type: neuralsignal_v1
  mongo_url: mongodb://hp.lan:27017/
  db: sdk_testing
  col: col
  mlflow_uri: "databricks"
  mlflow_experiment_path: "/Users/pablo@neuralsignal.ai/ns_mlflow"
  mlflow_register_model: False
  DATABRICKS_HOST: "https://adb-3426620886840199.19.azuredatabricks.net/"
  DATABRICKS_TOKEN: "dapi614c7116b0f6480963e9858ee06907c6-3"

# Detectors available
detectors:
  - behavior_name: "hallucination"
    S1_model: null
    S1_model_path: runs:/e2b9a4d5e9024d769d321490a05b8b13/S1
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Based on the content and question given tell me if the answer to the question is correct.\n
          Answer only with a single word - true or false. Remember to answer with only one word:\n
          Question {input}\n
          Answer: {output}\n Context: {context}\nRemember to output only true or false.
    enabled: True
  - behavior_name: "halu_prompt2"
    S1_model: null
