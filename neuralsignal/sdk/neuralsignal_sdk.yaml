# NeuralSignal SDK configuration
home: ./sdk_home
logging_level: INFO
# Evaluation mode can be indirect or direct
evaluation_mode: indirect
application_name: default # Needs to be defined when initializing
sub_application_name: default # Needs to be defined when initializing

# Generation Configs
max_new_tokens: 128
truncation_length: 0
use_dynamic_batch_size: True
max_oom_count: 20

# Evaluation mode config
indirect_config:
  #  indirect_model: "google/flan-t5-large"
  indirect_model: "t5-small"
  zone_size: 512
  indirect_batch_size: 100
  # no_quantization, int8 or int4
  quantization: "no_quantization"
  device: "cpu"
  use_dynamic_batch_size: True
  max_oom_count: 50 # SDK will disable itself after this

# indirect instrumentation config
indirect_instrumentation_config:
  instrument_encoder: True
  instrument_decoder: True
  instrument_attention: True
  instrument_FF: True
  instrument_embedding: True
  collector_config:
    mode: additive
    data_to_save: ["outputs", "layer_info", "topology"]
    zone_size: 512

# Backend config
save_scans: True
save_vectors: False
backend_config:
  backend_type: neuralsignal_v1
  mongo_url: mongodb://hp.lan:27017/
  db: sdk_testing
  col: col
  mlflow_uri: "http://z600.lan:8000"

# Detectors available
detectors:
  - behavior_name: "hallucination"
    S1_model: "t5-small"
    S1_model_path: "runs:/2fa39cc0a11f4f1eb37a0f991cc98c90/S1"
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Based on the content and question given tell me if the answer to the question is correct.\n
          Answer only with a single word - true or false. Remember to answer with only one word:\n
          Question {input}\n
          Answer: {output}\n Context: {context}\nRemember to output only true or false.
    enabled: True
  - behavior_name: "hallucination2"
    S1_model: "runs:/773318bc57c747e19cc0b8b5827809ee/xgboost1"
    S1_model_path: "runs:/773318bc57c747e19cc0b8b5827809ee/xgboost1"
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Number 2 - Based on the content and question given tell me if the answer to the question is correct.\n
          Answer only with a single word - true or false. Remember to answer with only one word:\n
          Question {input}\n
          Answer: {output}\n Context: {context}\nRemember to output only true or false.
    enabled: False
  - behavior_name: "text_categorizer"
    S1_model: null
    S1_model_path: null
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Based on the content given tell me what category the text belongs to.\n
          These are the categories: {context}\n
          Answer only with the number of the category in the list. Remember to answer with the number:\n
          Here is the content. \nContent given: {input}\n
    enabled: True
