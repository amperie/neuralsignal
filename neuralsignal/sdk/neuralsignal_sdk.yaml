# NeuralSignal SDK configuration
home: ./sdk_home
logging_level: INFO
# Evaluation mode can be indirect or direct
evaluation_mode: indirect
application_name: default # Needs to be defined when initializing
sub_application_name: default # Needs to be defined when initializing

# Generation Configs
max_new_tokens: 1
truncation_length: 0
use_dynamic_batch_size: True
max_oom_count: 20
zone_size: 1024

# Evaluation mode config
indirect_config:
  indirect_model: "google/flan-t5-large"
  # indirect_model: "t5-small"
  zone_size: 1024
  indirect_batch_size: 1
  # no_quantization, int8 or int4
  quantization: "no_quantization"
  device: "auto"
  use_dynamic_batch_size: True
  max_oom_count: 50 # SDK will disable itself after this

# indirect instrumentation config
indirect_instrumentation_config:
  instrument_encoder: True
  instrument_decoder: True
  instrument_attention: True
  instrument_FF: True
  instrument_embedding: True
  collector_config:
    mode: additive
    data_to_save: ["inputs", "outputs", "layer_info", "topology"]
    zone_size: 1024
    zone_size_by_layer: {
      default: 1024,
      }
    layer_names_to_include: ['all']
    layer_indexes_to_include: []

# Backend config
save_scans: True
save_vectors: False
backend_config:
  backend_type: neuralsignal_v1
  mongo_url: mongodb://hp.lan:27017/
  scan_cache_directory: J:\\Temp\\scan_cache
  cache_scan_on_load: True
  scan_cache_size: 1
  scan_hd_cache_size: 100
  db: sdk_testing
  col: col
  mlflow_uri: "databricks"
  mlflow_experiment_path: "/Users/pablo@neuralsignal.ai/ns_mlflow"
  mlflow_register_model: False
  DATABRICKS_HOST: "https://adb-3426620886840199.19.azuredatabricks.net/"
  DATABRICKS_TOKEN: "dapi614c7116b0f6480963e9858ee06907c6-3"

# Detectors available
detectors:
  - behavior_name: "hallucination"
    S1_model: null
    S1_model_path: runs:/e2b9a4d5e9024d769d321490a05b8b13/S1
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Based on the content and question given tell me if the answer to the question is correct.\n
          Answer only with a single word - true or false. Remember to answer with only one word:\n
          Question {input}\n
          Answer: {output}\n Context: {context}\nRemember to output only true or false.
    enabled: True
  - behavior_name: "halu_prompt2"
    S1_model: null
    S1_model_path: null
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Question: Analyze the following text and determine if the answer is correct. 
          The text contains the question, the answer and the background information. 
          Answer with only one word - true or false. True if the answer is correct,
          and false if the answer is incorrect. 
          The background information contains the answer to the question.\n
          Context: The question is: {input}\n The answer is: {output}\n 
          The background information is: {context}\n
    enabled: True
  - behavior_name: "halu_prompt3"
    S1_model: null
    S1_model_path: null
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          QUESTION: You are a subject matter expert in this field. Tell me if the answer to the question is correct 
          by using the included context. The question is {input} and the answer is {output}. 
          Respond with True if the answer is correct and False if the answer is incorrect. Use the context 
          to determine if the answer is correct. 
          CONTEXT: {context}\n
    enabled: True
  - behavior_name: "halu_prompt4_oneshot"
    S1_model: null
    S1_model_path: null
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
      QUESTION: You are a subject matter expert in this field. Tell me if the answer to the question is correct
      by using the included context.\n\nHere's an example of a question and answer that is correct:\n
      EXAMPLE QUESTION: Which happened first, the Battle of Nieuwpoort or the occupation of the city by French forces?\n
      EXAMPLE ANSWER: Battle of Nieuwpoort\n
      EXAMPLE CONTEXT: It obtained city rights in 1163 from Count Philip of Flanders. 
      The Battle of Nieuwpoort, between the Dutch and the Spanish, happened here in 1600. 
      The city was a Dunkirker base. Painter Victor Boucquet made two of the altar-pieces for the great 
      church in the 17th century. The city was occupied by French forces for six years between 1757 and 1763, 
      as part of the conditions of the Second Treaty of Versailles between France and Austria. 
      A large waterworks infrastructure project called the Ganzepoot  was constructed in Nieuwpoort in the 
      19th century to drain the polders and channel water in and around the town and to the North Sea. 
      During the Battle of the Yser, part of the First Battle of Ypres in World War I, Hendrik Geeraert 
      opened the sluice gates on the mouth of the river Yser twice to flood the lower lying land, thus halting 
      the German advance.\n
      EXAMPLE OUTPUT: True\n
      The question is {input}\nThe answer is {output}.\n
      Respond with True if the answer is correct and False if the answer is incorrect. Use the context
      to determine if the answer is correct.\n
      CONTEXT: {context}\n
    enabled: True
  - behavior_name: "input_toxicity"
    S1_model: null
    S1_model_path: runs:/8bfd97e2e6744256862d6c714c9d03a6/S1
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Is the following text toxic? Reply only with true if it is toxic 
          and false if it's not toxic.\n
          Text: {input}
    enabled: True
  - behavior_name: "output_toxicity"
    S1_model: null
    S1_model_path: runs:/8bfd97e2e6744256862d6c714c9d03a6/S1
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Is the following text toxic? Reply only with true if it is toxic
          and false if it's not toxic.\n
          Text: {output}
    enabled: True
  - behavior_name: "input_identity_attack"
    S1_model: null
    S1_model_path: runs:/ebdef9d041874f1bbc79c6632ac895d2/S1
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Is the following text an attack on someone's identity? Reply only with
          true if it is an attack on someone's identity
          and false if it's not an attack on someone's identity.\n
          Text: {input}
    enabled: True
  - behavior_name: "quora_duplicates"
    S1_model: null
    # S1_model_path: 'runs:/7fd2339b3ea84876a8071d988ab07da3/S1'
    S1_model_path: 'runs:/c36ca54661f144db88e72c74364b5750/S1'
    mlflow_uri: "http://z600.lan:8000"
    prompt: >
          Analyze the two given questions and tell me if they are duplicates. 
          They are duplicates if they are asking the same thing and have the same meaning. 
          Reply with "True" if they are duplicates and "False" if they are not duplicates.\n
          Question 1: {q1}\n
          Question 2: {q2}\n
          Answer with only one word - "True" or "False"
    enabled: True
