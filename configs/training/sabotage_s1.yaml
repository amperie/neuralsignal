dataset:
  path: runs/remote/example-run
  label_column: sabotage

features:
  include_sets:
    - zones
    - layer_distribution
  include_columns: []
  exclude_columns: []

model:
  type: xgboost
  params:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.1
    tree_method: hist
    device: cpu
    n_jobs: 4
    objective: binary:logistic
    eval_metric: logloss

mlflow:
  tracking_uri: http://z440.lan:5000
  experiment_name: neuralsignal-s1
  run_name: sabotage-s1-local
  registered_model_name: neuralsignal-sabotage-s1

