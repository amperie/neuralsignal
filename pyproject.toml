[project]
name = "neuralsignal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "bitsandbytes",
    "datasets",
    "huggingface-hub",
    "pymongo",
    "pandas",
    "scikit-learn",
    "xgboost",
    "hyperopt",
    "mlflow",
    "pygments",
    "pyyaml",
    "tqdm",
    "pytest",
    "pip>=26.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuralsignal*"]

[tool.setuptools.package-data]
"neuralsignal.automation" = ["*.yaml"]
