[project]
name = "neuralsignal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers",
    "bitsandbytes",
    "accelerate",
    "datasets",
    "boto3",
    "huggingface-hub",
    "pandas",
    "scikit-learn",
    "mlflow",
    "pygments",
    "pyyaml",
    "tqdm",
    "pytest",
    "pip>=26.1.1",
    "setuptools<82",
]

[project.scripts]
ns = "neuralsignal.cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neuralsignal*"]

