[project]
name = "neuralsignal"
version = "0.1.0"
description = "Detect behavioral anomalies in LLM outputs through real-time model instrumentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "huggingface-hub>=0.22.0",
    "bitsandbytes>=0.43.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "hyperopt>=0.2.7",
    "pandas>=2.0.0",
    "pymongo>=4.0.0",
    "mlflow>=2.0.0",
    "pyyaml>=6.0.0",
    "pygments>=2.17.0",
    "tqdm>=4.66.0",
    "notebook>=7.5.5",
    "pip>=26.0.1",
    "ipywidgets>=8.1.8",
    "accelerate>=1.13.0",
    "setuptools>=82.0.1",
    "optuna>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
